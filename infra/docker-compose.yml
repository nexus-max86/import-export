# Services locaux pour le développement : `docker compose -f infra/docker-compose.yml up -d`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: konzia
      POSTGRES_PASSWORD: konzia
      POSTGRES_DB: konzia_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U konzia']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
