name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: konzia
          POSTGRES_PASSWORD: konzia
          POSTGRES_DB: konzia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U konzia" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://konzia:konzia@localhost:5432/konzia_test
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      HASH_SALT: ci-salt-ci-salt-ci-salt-ci-salt-ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @konzia/shared --filter @konzia/db build
      - run: pnpm db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @konzia/web exec playwright install --with-deps chromium
      - run: pnpm e2e
